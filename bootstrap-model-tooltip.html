<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <title>Bootstrap Model</title>
</head>

<body>
    <div class="container mt-3">
        <h2>Static backdrop</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#add">
            Add
        </button>
        <div class="modal fade" id="add" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="container">
                                <div class="form-group">
                                    <div class="row">
                                        <div class="col-6">
                                            <input type="text" name="name" placeholder="Name" class="form-control">
                                        </div>
                                        <div class="col-6">
                                            <input type="email" name="email" placeholder="Email" class="form-control">
                                        </div>
                                    </div><br>
                                    <div class="row">
                                        <div class="col-8">
                                            <textarea rows="3" placeholder="Address" class="form-control"></textarea>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Save changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div class="container mt-3">
        <h2>Scrollable Modal</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#edit">
            Edit
        </button>

        <!-- Modal -->
        <div class="modal fade" id="edit" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Edit</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="container">
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="name" class="form-label">Name</label>
                                        <input type="text" id="name" name="name" placeholder="Name"
                                            class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" id="email" name="email" placeholder="Email"
                                            class="form-control">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="address" class="form-label">Address</label>
                                        <textarea id="address" rows="3" placeholder="Address"
                                            class="form-control"></textarea>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="text" id="phone" name="phone" placeholder="Phone" maxlength="10"
                                            class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="pincode" class="form-label">Pincode</label>
                                        <input type="text" id="pincode" name="pincode" placeholder="Pincode"
                                            maxlength="6" class="form-control">
                                    </div>
                                </div>

                                <!-- Additional Fields to Make Form Longer -->
                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="city" class="form-label">City</label>
                                        <input type="text" id="city" name="city" placeholder="City"
                                            class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="state" class="form-label">State</label>
                                        <input type="text" id="state" name="state" placeholder="State"
                                            class="form-control">
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-6">
                                        <label for="dob" class="form-label">Date of Birth</label>
                                        <input type="date" id="dob" name="dob" class="form-control">
                                    </div>
                                    <div class="col-6">
                                        <label for="gender" class="form-label">Gender</label>
                                        <select id="gender" name="gender" class="form-select">
                                            <option value="">Select</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-12">
                                        <label for="bio" class="form-label">Bio</label>
                                        <textarea id="bio" rows="4" placeholder="Write something about yourself..."
                                            class="form-control"></textarea>
                                    </div>
                                </div>

                            </div>
                        </form>
                    </div>

                    <!-- Modal Footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div class="container mt-3">
        <h2>Tooltips and popovers</h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tooltip">
            Tooltips and popovers demo
        </button>
        <div class="modal fade" id="tooltip" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editModalLabel">Tooltips and popovers demo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <h2 class="fs-5">Popover in a modal</h2>
                        <p>This <button class="btn btn-secondary" data-bs-toggle="popover" title="Popover title"
                                data-bs-content="Popover body content is set in this attribute.">button</button>
                            triggers a popover on
                            click.</p>
                        <hr>
                
                        <h2 class="fs-5">Tooltips in a modal</h2>
                        <p><a href="#" data-bs-toggle="tooltip" title="Tooltip">This link</a> and <a href="#"
                                data-bs-toggle="tooltip" title="Tooltip">that link</a> have tooltips on hover.</p>
                        <hr>

                        <div class="container">
                            <h2>bootstrap 5 popover</h2>
                            <button type="button" class="btn btn-primary m-2" data-bs-toggle="popover"
                                data-bs-placement="top" title="Popover Title" data-bs-content="This is a top popover">
                                Click me (Top)
                            </button>

                            <button type="button" class="btn btn-secondary m-2" data-bs-toggle="popover"
                                data-bs-placement="right" title="Popover Title"
                                data-bs-content="This is a right popover">
                                Click me (Right)
                            </button>

                            <button type="button" class="btn btn-success m-2" data-bs-toggle="popover"
                                data-bs-placement="bottom" title="Popover Title"
                                data-bs-content="This is a bottom popover">
                                Click me (Bottom)
                            </button>

                            <button type="button" class="btn btn-danger m-2" data-bs-toggle="popover"
                                data-bs-placement="left" title="Popover Title" data-bs-content="This is a left popover">
                                Click me (Left)
                            </button>
                        </div>
                        <hr>
                    <div class="container">
                        <h2>Bootstrap 5 Tooltips</h2>

                        <button type="button" class="btn btn-primary m-2" data-bs-toggle="tooltip" data-bs-placement="top"
                            title="Tooltip on top">
                            Hover me (Top)
                        </button>

                        <button type="button" class="btn btn-secondary m-2" data-bs-toggle="tooltip"
                            data-bs-placement="right" title="Tooltip on right">
                            Hover me (Right)
                        </button>

                        <button type="button" class="btn btn-success m-2" data-bs-toggle="tooltip"
                            data-bs-placement="bottom" title="Tooltip on bottom">
                            Hover me (Bottom)
                        </button>

                        <button type="button" class="btn btn-danger m-2" data-bs-toggle="tooltip" data-bs-placement="left"
                            title="Tooltip on left">
                            Hover me (Left)
                        </button>
                    </div>
                    </div>
                    
                    <!-- Modal Footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script src="js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl);
        });
    });
    document.addEventListener("DOMContentLoaded", function () {
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
});
</script>

</html>
